name: Set up Zig Toolchain
description: Set up Zig in GitHub Actions for use in your workflow.
author: Jassiel Ovando

branding:
  color: yellow
  icon: zap
inputs:
  version:
    description: The version to install — a specific semver, master (nightly), or
      latest (default stable).
    default: latest
  cache:
    description: Enable caching of the Zig toolchain (~/.zig) and build artifacts.
    default: "true"
  cache-toolchain:
    description: When cache is enabled, save and restore the Zig install under
      ~/.zig separately from build artifacts.
    default: "true"
  cache-dependency-path:
    description: Files whose content affects the build cache key (glob). Does not
      affect the toolchain cache key.
    default: |
      build.zig
      build.zig.zon
  cache-path:
    description: Paths to include in the build artifact cache, separated by newlines.
    default: |
      **/.zig-cache
  target:
    description: Zig cross-compilation target (improves build cache correctness).

runs:
  using: composite
  steps:
    # Resolve the version and compute the toolchain cache key segment in one
    # Python invocation so the install step never has to re-fetch the index.
    - name: Resolve version & toolchain cache key
      id: toolchain-key
      if: inputs.cache == 'true' && inputs.cache-toolchain == 'true'
      shell: bash
      run: |
        set -euo pipefail
        SCRIPT="${{ github.action_path }}/scripts/installer.py"
        VERSION="${{ inputs.version }}"
        if command -v python3 >/dev/null 2>&1; then
          OUTPUT="$(python3 "$SCRIPT" --print-toolchain-cache-key --version "$VERSION" 2>/dev/null)"
        elif command -v python >/dev/null 2>&1; then
          OUTPUT="$(python  "$SCRIPT" --print-toolchain-cache-key --version "$VERSION" 2>/dev/null)"
        elif command -v py   >/dev/null 2>&1; then
          OUTPUT="$(py -3   "$SCRIPT" --print-toolchain-cache-key --version "$VERSION" 2>/dev/null)"
        else
          echo "Python runtime not found on PATH" >&2; exit 1
        fi
        SEGMENT="$(printf '%s\n' "$OUTPUT" | head -n1)"
        RESOLVED="$(printf '%s\n' "$OUTPUT" | tail -n1)"
        if [ -z "$SEGMENT" ] || [ -z "$RESOLVED" ]; then
          echo "Failed to compute toolchain cache key" >&2; exit 1
        fi
        echo "segment=$SEGMENT"          >> "$GITHUB_OUTPUT"
        echo "resolved-version=$RESOLVED" >> "$GITHUB_OUTPUT"

    - name: Restore Zig toolchain
      if: inputs.cache == 'true' && inputs.cache-toolchain == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.zig
        key: |
          zig-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain-key.outputs. segment }}
    - name: Install Zig
      shell: bash
      run: |
        set -euo pipefail
        SCRIPT="${{ github.action_path }}/scripts/installer.py"
        # Use the version already resolved above (avoids a second index fetch);
        # falls back to the raw input when the cache steps were skipped.
        VERSION="${{ steps.toolchain-key.outputs.resolved-version || inputs.version }}"
        if command -v python3 >/dev/null 2>&1; then
          python3 "$SCRIPT" --version "$VERSION"
        elif command -v python >/dev/null 2>&1; then
          python  "$SCRIPT" --version "$VERSION"
        elif command -v py   >/dev/null 2>&1; then
          py -3   "$SCRIPT" --version "$VERSION"
        else
          echo "Python runtime not found on PATH" >&2; exit 1
        fi

    - name: Compute build cache key
      id: cache-key
      if: inputs.cache == 'true'
      shell: bash
      run: |
        set -euo pipefail

        TARGET="${{ inputs.target }}"
        [ -z "$TARGET" ] && TARGET="default"

        ZIG_VERSION="$(zig version)"

        KEY="zig-build-${{ runner.os }}-${{ runner.arch }}-${ZIG_VERSION}-${TARGET}-${{ hashFiles(inputs.cache-dependency-path) }}"
        echo "key=$KEY" >> "$GITHUB_OUTPUT"

    - name: Resolve Zig cache dirs
      id: zig-cache
      shell: bash
      run: |
        set -euo pipefail

        GLOBAL_CACHE_DIR="${ZIG_GLOBAL_CACHE_DIR:-${RUNNER_TEMP}/setup-zig-global-cache}"

        mkdir -p "$GLOBAL_CACHE_DIR"

        echo "global-cache-dir=$GLOBAL_CACHE_DIR" >> "$GITHUB_OUTPUT"
        echo "ZIG_GLOBAL_CACHE_DIR=$GLOBAL_CACHE_DIR" >> "$GITHUB_ENV"

    - name: Restore build cache
      if: inputs.cache == 'true'
      uses: actions/cache@v5
      with:
        path: |
          ${{ steps.zig-cache.outputs.global-cache-dir }}
          ${{ inputs.cache-path }}
        key: ${{ steps.cache-key.outputs.key }}

    - name: Prepare Zig cache dirs
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p "${{ steps.zig-cache.outputs.global-cache-dir }}/tmp"
        mkdir -p "${{ steps.zig-cache.outputs.global-cache-dir }}/p"
        mkdir -p .zig-cache
