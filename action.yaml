name: Set up Zig
description: Install a verified Zig toolchain and restore Zig's build caches.
author: Jassiel Ovando

branding:
  color: yellow
  icon: zap

inputs:
  version:
    description: >-
      Zig release, full development version, latest, master, or Mach nominated
      version. When omitted, reads build.zig.zon's minimum_zig_version and then
      falls back to the latest stable release.
    required: false
  version-file:
    description: ZON manifest used for automatic version detection.
    default: build.zig.zon
  minimum-version:
    description: Reject a resolved Zig version older than this release or full development version.
    required: false
  mirror:
    description: >-
      HTTPS Zig community mirror override, for example
      https://pkg.hexops.org/zig. The override is used exclusively.
    required: false
  cache:
    description: Restore and save the toolchain, Zig global cache, and project build cache.
    default: "true"
  cache-toolchain:
    description: Cache the extracted Zig toolchain when cache is enabled.
    default: "true"
  cache-key:
    description: >-
      Extra build-cache key segment. Use this for build options that affect
      cache compatibility, such as a target or optimization mode.
    required: false
  cache-dependency-path:
    description: Newline-separated glob patterns hashed into the build-cache key.
    default: |-
      build.zig
      build.zig.zon
  cache-path:
    description: >-
      Additional newline-separated build-cache paths or glob patterns. Zig's
      global cache and $ZIG_LOCAL_CACHE_DIR are always included. Add zig-pkg to
      preserve Zig 0.16's expanded project-local dependency tree.
    required: false
  cache-size-limit:
    description: Maximum build-cache upload size in MiB. Zero disables the limit.
    default: "2048"

outputs:
  version:
    description: Exact installed Zig version.
  path:
    description: Directory containing the Zig executable.
  cache-hit:
    description: Whether any compatible Zig build cache was restored.
  toolchain-cache-hit:
    description: Whether the extracted Zig toolchain was already cached.

runs:
  using: node24
  main: dist/index.js
  post: dist/post/index.js
  post-if: success()
