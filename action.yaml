name: Set up Zig Toolchain
description: Set up Zig in GitHub Actions for use in your workflow.
author: Jassiel Ovando

branding:
  color: yellow
  icon: zap
inputs:
  version:
    description: The version to install, either a specific, master (from Git development branch) or default to the latest stable.
    default: latest
  cache:
    description: Enable caching of the Zig toolchain (~/.zig) and build artifacts.
    default: "false"
  cache-toolchain:
    description: When cache is enabled, restore and save the Zig install under ~/.zig (keyed by OS, runner arch, and resolved version).
    default: "true"
  cache-dependency-path:
    description: Dependency files affecting the build cache (glob). Does not affect the toolchain cache.
    default: |
      build.zig
      build.zig.zon
  cache-path:
    description: Paths to include in the build cache, separated by newlines.
    default: |
      **/.zig-cache
      **/zig-out
  target:
    description: Zig target to improve build cache correctness.

runs:
  using: composite
  steps:
    - name: Toolchain cache key
      id: toolchain-key
      if: inputs.cache == 'true' && inputs.cache-toolchain == 'true'
      shell: bash
      run: |
        set -euo pipefail
        SCRIPT="${{ github.action_path }}/scripts/installer.py"
        VERSION="${{ inputs.version }}"
        if command -v python3 >/dev/null 2>&1; then
          SEGMENT="$(python3 "$SCRIPT" --print-toolchain-cache-key --version "$VERSION")"
        elif command -v python >/dev/null 2>&1; then
          SEGMENT="$(python "$SCRIPT" --print-toolchain-cache-key --version "$VERSION")"
        elif command -v py >/dev/null 2>&1; then
          SEGMENT="$(py -3 "$SCRIPT" --print-toolchain-cache-key --version "$VERSION")"
        else
          echo "Python runtime not found on PATH" >&2
          exit 1
        fi
        if [ -z "$SEGMENT" ]; then
          echo "Failed to compute toolchain cache key (empty segment)" >&2
          exit 1
        fi
        echo "segment=$SEGMENT" >> "$GITHUB_OUTPUT"

    - name: Restore Zig toolchain
      if: inputs.cache == 'true' && inputs.cache-toolchain == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ runner.os == 'Windows' && format('{0}/.zig', env.USERPROFILE) || format('{0}/.zig', env.HOME) }}
        key: zig-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain-key.outputs.segment }}

    - name: Install Zig
      shell: bash
      run: |
        set -euo pipefail
        SCRIPT="${{ github.action_path }}/scripts/installer.py"
        VERSION="${{ inputs.version }}"
        if command -v python3 >/dev/null 2>&1; then
          python3 "$SCRIPT" --version "$VERSION"
        elif command -v python >/dev/null 2>&1; then
          python "$SCRIPT" --version "$VERSION"
        elif command -v py >/dev/null 2>&1; then
          py -3 "$SCRIPT" --version "$VERSION"
        else
          echo "Python runtime not found on PATH" >&2
          exit 1
        fi

    - name: Compute build cache key
      id: cache-key
      if: inputs.cache == 'true'
      shell: bash
      run: |
        set -euo pipefail

        TARGET="${{ inputs.target }}"
        [ -z "$TARGET" ] && TARGET="default"

        KEY="zig-build-${{ runner.os }}-${{ inputs.version }}-${TARGET}-${{ hashFiles(inputs.cache-dependency-path) }}"

        echo "key=$KEY" >> "$GITHUB_OUTPUT"

    - name: Restore build cache
      if: inputs.cache == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ steps.cache-key.outputs.key }}
