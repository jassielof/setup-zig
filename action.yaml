name: Set up Zig
description: Install a verified Zig toolchain and restore Zig's build caches.
author: Jassiel Ovando

branding:
  color: yellow
  icon: zap

inputs:
  version:
    description: >-
      Zig release, full development version, latest, master, or Mach nominated
      version. When omitted, reads build.zig.zon's minimum_zig_version and then
      falls back to the latest stable release.
    required: false
  version-file:
    description: ZON manifest used for automatic version detection.
    default: build.zig.zon
  minimum-version:
    description: Reject a resolved Zig version older than this release or full development version.
    required: false
  mirror:
    description: >-
      HTTPS Zig community mirror override, for example
      https://pkg.hexops.org/zig. The override is used exclusively.
    required: false
  cache:
    description: Restore and save the toolchain, Zig global cache, and project build cache.
    default: "true"
  cache-toolchain:
    description: Cache the extracted Zig toolchain when cache is enabled.
    default: "true"
  cache-build:
    description: Cache Zig's global and project-local build data when cache is enabled.
    default: "true"
  cache-key:
    description: >-
      Extra build-cache key segment. Use this for build options that affect
      cache compatibility, such as a target or optimization mode.
    required: false
  cache-dependency-path:
    description: Newline-separated glob patterns hashed into the build-cache key.
    default: |-
      build.zig
      build.zig.zon
  cache-path:
    description: >-
      Additional newline-separated build-cache paths or glob patterns. Zig's
      global cache and $ZIG_LOCAL_CACHE_DIR are always included. Add zig-pkg to
      preserve Zig 0.16's expanded project-local dependency tree.
    required: false
  cache-size-limit:
    description: Maximum build-cache upload size in MiB. Zero disables the limit.
    default: "0"

outputs:
  version:
    description: Exact installed Zig version.
  path:
    description: Directory containing the Zig executable.
  cache-hit:
    description: Whether any compatible Zig build cache was restored.
  build-cache-hit:
    description: Whether any compatible Zig build cache was restored.
  build-cache-exact-hit:
    description: Whether the primary Zig build-cache key matched exactly.
  build-cache-key:
    description: Primary Zig build-cache key.
  build-cache-matched-key:
    description: Exact or fallback Zig build-cache key that was restored.
  toolchain-cache-hit:
    description: Whether the extracted Zig toolchain was already cached.
  toolchain-cache-key:
    description: Zig toolchain cache key.
  toolchain-source:
    description: Whether Zig came from cache or a verified download.
  platform:
    description: Resolved Zig platform name.
  arch:
    description: Resolved Zig architecture name.
  runner-image:
    description: Runner image discriminator used for build caching.
  version-resolution-ms:
    description: Time spent resolving the requested Zig version in milliseconds.
  toolchain-ms:
    description: Time spent restoring or installing the Zig toolchain in milliseconds.
  build-cache-ms:
    description: Time spent preparing and restoring the Zig build cache in milliseconds.
  setup-ms:
    description: Total action setup time in milliseconds.
  timings:
    description: JSON object containing all setup timing measurements.
  cache-mode:
    description: Effective GitHub Actions cache access mode reported by the runner.

runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
  post-if: success()
