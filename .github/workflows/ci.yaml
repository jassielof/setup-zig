name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    name: Source and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run build
      - name: Verify committed bundle
        run: git diff --exit-code -- dist

  integration:
    name: ${{ matrix.os }} / Zig ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: [latest, master, 0.15.2]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Zig
        id: zig
        uses: ./
        with:
          version: ${{ matrix.version }}
          cache-key: integration
      - name: Verify installation and build
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.zig.outputs.version }}
          ZIG_PATH: ${{ steps.zig.outputs.path }}
        run: |
          test "$(zig version)" = "$EXPECTED_VERSION"
          test -x "$ZIG_PATH/zig" || test -x "$ZIG_PATH/zig.exe"
          mkdir smoke
          cd smoke
          zig init
          zig build test --summary all

  manifest-version:
    name: Version from build.zig.zon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Write test manifest
        shell: bash
        run: printf '.{ .name = .smoke, .version = "0.0.0", .minimum_zig_version = "0.15.2", .dependencies = .{}, .paths = .{"."}, }\n' > build.zig.zon
      - id: zig
        uses: ./
        with:
          cache: false
      - name: Verify manifest selection
        shell: bash
        env:
          VERSION: ${{ steps.zig.outputs.version }}
        run: test "$VERSION" = "0.15.2"
